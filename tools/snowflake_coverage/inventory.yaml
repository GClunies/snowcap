meta:
  docs_read_on: '2026-10-09'
  scope: GA and public preview. Deprecated, private preview, and classes are excluded.
account:
  edition: ENTERPRISE
  cloud: AWS
  cloud_region: US_WEST_2
  snowflake_version: 10.36.101
  test_role: ACCOUNTADMIN
  checked_on: '2026-10-09'
objects:
- object: SCHEMA
  variant: null
  scope_level: database
  status: ga
  edition: standard
  docs:
    create: https://docs.snowflake.com/en/sql-reference/sql/create-schema
    alter: https://docs.snowflake.com/en/sql-reference/sql/alter-schema
    show: https://docs.snowflake.com/en/sql-reference/sql/show-schemas
    describe: https://docs.snowflake.com/en/sql-reference/sql/desc-schema
  docs_read_on: 2026-10-09
  creation_forms:
  - CREATE [ OR REPLACE ] [ TRANSIENT ] SCHEMA [ IF NOT EXISTS] <name>; OR REPLACE and IF NOT EXISTS are mutually exclusive.
  - CREATE OR ALTER [ TRANSIENT ] SCHEMA <name>; cannot rename, swap, clone, change tags/policies, or change transience.
  - 'DEFINE SCHEMA: DCM-project definition-file-only equivalent of CREATE OR ALTER.'
  - CREATE SCHEMA ... CLONE <source_schema> [ AT | BEFORE (...) ] [ IGNORE TABLES WITH INSUFFICIENT DATA RETENTION ] [ IGNORE
    HYBRID TABLES ].
  - CREATE SCHEMA <name> FROM BACKUP SET <backup_set> IDENTIFIER '<backup_id>'; restore preserves backed-up properties.
  properties:
  - name: name
    sql: <name>
    kind: identity
    in_create: true
    alter: action
    alter_syntax: ALTER SCHEMA <name> RENAME TO <new_schema_name>
    unset: false
    combinable: false
    edition: standard
    status: ga
    read_back: SHOW SCHEMAS column name
    docs: https://docs.snowflake.com/en/sql-reference/sql/alter-schema
    notes: RENAME may move the schema by qualifying the new name with an existing database.
    snowcap:
      field: name
      n_a: Identity. A different value declares a different object.
  - name: database
    sql: <database>
    kind: identity
    in_create: true
    alter: action
    alter_syntax: ALTER SCHEMA <name> RENAME TO <database>.<new_schema_name>
    unset: false
    combinable: false
    edition: standard
    status: ga
    read_back: SHOW SCHEMAS column database_name
    docs: https://docs.snowflake.com/en/sql-reference/sql/alter-schema
    notes: CREATE uses the current database unless the schema name is qualified.
    snowcap:
      field: null
      n_a: Identity. snowcap sets it from the container.
  - name: transient
    sql: TRANSIENT
    kind: identity
    in_create: true
    alter: none
    alter_syntax: ''
    unset: false
    combinable: false
    edition: standard
    status: ga
    read_back: SHOW SCHEMAS column options
    docs: https://docs.snowflake.com/en/sql-reference/sql/create-schema
    notes: Default is permanent; CREATE OR ALTER cannot convert between transient and non-transient.
    snowcap:
      field: transient
      sample:
      - true
      - false
      levels:
        L1: pass
        L2: pass
        L3: pass
        L4: pass
        L5: n/a
      candidates:
      - 'L4: ALTER cannot change it, but the spec does not set triggers_replacement, so snowcap plans an ALTER'
      evidence:
        create_sql:
        - CREATE TRANSIENT SCHEMA COVERAGE_SCHEMA_69B0469B.R00_TRANSIENT
        L4: 'snowcap refuses: Exception: Cannot change transient property of schema'
        L5: 'no round trip: the property is immutable and snowcap correctly refuses the change'
  - name: swap_with
    sql: SWAP_WITH
    kind: identity
    in_create: false
    alter: action
    alter_syntax: ALTER SCHEMA <name> SWAP WITH <target_schema_name>
    unset: false
    combinable: false
    edition: standard
    status: ga
    read_back: SHOW SCHEMAS columns name, database_name
    docs: https://docs.snowflake.com/en/sql-reference/sql/alter-schema
    notes: Swaps objects, metadata, identifiers, and access-control privileges.
    snowcap:
      field: null
      n_a: One-time operation, not a declared state.
  - name: managed_access
    sql: MANAGED_ACCESS
    kind: relationship
    in_create: true
    alter: action
    alter_syntax: ALTER SCHEMA <name> { ENABLE | DISABLE } MANAGED ACCESS
    unset: false
    combinable: false
    edition: standard
    status: ga
    read_back: SHOW SCHEMAS column options
    docs: https://docs.snowflake.com/en/sql-reference/sql/alter-schema
    notes: CREATE syntax is WITH MANAGED ACCESS.
    snowcap:
      field: managed_access
      sample:
      - true
      - false
      levels:
        L1: pass
        L2: pass
        L3: pass
        L4: pass
        L5: pass
      candidates: []
      evidence:
        create_sql:
        - CREATE SCHEMA COVERAGE_SCHEMA_69B0469B.R01_MANAGED_ACCESS WITH MANAGED ACCESS
        L4_sql:
        - ALTER SCHEMA COVERAGE_SCHEMA_69B0469B.R01_MANAGED_ACCESS DISABLE MANAGED ACCESS
  - name: owner
    sql: OWNERSHIP
    kind: relationship
    in_create: false
    alter: action
    alter_syntax: GRANT OWNERSHIP ON SCHEMA <name> TO ROLE <role>
    unset: false
    combinable: false
    edition: standard
