  docs_read_on: 2026-10-09
  creation_forms:
  - 'CREATE TABLE: explicit column definitions.'
  - 'CREATE OR ALTER TABLE: declaratively creates or modifies a table.'
  - 'CTAS: CREATE TABLE ... AS SELECT.'
  - 'USING TEMPLATE: derives columns from INFER_SCHEMA output.'
  - 'LIKE: empty copy of a source table definition.'
  - 'CLONE: zero-copy clone, optionally at a Time Travel point.'
  - 'FROM ARCHIVE OF: creates from archived rows selected by WHERE.'
  - 'FROM BACKUP SET: restores a backed-up table under a name.'
